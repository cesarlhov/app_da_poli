name: app_da_poli
description: "A new Flutter project."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  go_router: ^14.1.2
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10+1
  google_generative_ai: ^0.4.7
  google_sign_in: ^7.1.1
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1
  provider: ^6.1.2
  image_picker: ^1.2.3
  firebase_storage: ^11.7.7
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

# 🟢 CONFIGURAÇÃO DO ÍCONE DO APP EM CAMADAS (Adaptive Icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logochaskamargem_icon.png" 
  adaptive_icon_background: "#FFFFFF"             
  adaptive_icon_foreground: "assets/images/logochaskamargem_icon.png" 
  min_sdk_android: 21

# 🟢 CONFIGURAÇÃO DA TELA NATIVA
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logochaskamargem_icon.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/logochaskamargem_icon.png"

flutter:
  uses-material-design: true

  # A pasta inteira está mapeada, então as 4 imagens já vão funcionar direto!
  assets:
    - assets/fonts/
    - .env
    - assets/images/

  fonts:
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700
        - asset: assets/fonts/LeagueSpartan-ExtraBold.ttf
          weight: 800
          
    # No código das telas, nós usamos apenas 'Aristotelica'. 
    # Vou unificar aqui para o botão e os textos pegarem a fonte Condensed-Bold corretamente.
    - family: Aristotelica
      fonts:
        - asset: assets/fonts/AristotelicaProDisplayCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/Aristotelica-Pro-Text-Condensed-Demibold-TRIAL.ttf
          weight: 600
          
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-BlackItalic.ttf
          style: italic
          weight: 900
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
          
    - family: Yellowtail
      fonts:
        - asset: assets/fonts/Yellowtail-Regular.ttf
        
    # <<< NOVA FONTE PARA A ASSINATURA DA TELA DE ABERTURA >>>
    - family: MonumentExtended
      fonts:
        - asset: assets/fonts/MonumentExtended-Regular.otf
          weight: 400
        - asset: assets/fonts/MonumentExtended-Black.ttf
          weight: 700
        - asset: assets/fonts/MonumentExtended-Ultrabold.otf
          weight: 900
    - family: PPMonumentExtended
      fonts:
        - asset: assets/fonts/PPMonumentExtended-Black.otf
          weight: 800 